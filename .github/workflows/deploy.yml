name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # daily, just after midnight in New York (05:17 UTC)
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Rebuild the history and legends archives'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Tests
        run: |
          node scripts/test-fetch.mjs
          node leaderboard/test-code.mjs

      - name: Cache key (weekly)
        id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore archive cache
        uses: actions/cache@v5
        with:
          path: .cache
          key: archive-v1-${{ steps.week.outputs.key }}
          restore-keys: archive-v1-

      - name: Fetch real asteroid data (NASA/JPL CNEOS)
        run: node scripts/fetch-data.mjs
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh && '1' || '0' }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub pauses scheduled workflows in public repos after 60 days without
  # commits. An empty commit on the 1st of each month keeps the daily sky
  # refreshing. Pushes made with GITHUB_TOKEN don't trigger another run.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Monthly keepalive commit
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep the daily data refresh alive"
            git push
          fi
